<style>
/* Layout: full-bleed live 3D view; caption card bottom-left, plan minimap top-right, one dock with room chips and scrubber along the bottom. */
:root {
  --paper: #F1EEEA;
  --ink: #231C18;
  --ink-2: #5E524A;
  --brown: #8C6A57;
  --brown-deep: #6F5141;
  --glass: rgba(241, 238, 234, .86);
  --glass-line: rgba(35, 28, 24, .16);
  --hot: #E8D9C7;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1C1612; --ink: #F1EAE2; --ink-2: #B8A99C; --brown: #C79B82; --brown-deep: #D8B49E;
    --glass: rgba(28, 22, 18, .82); --glass-line: rgba(241, 234, 226, .18); --hot: #3A2D25; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1C1612; --ink: #F1EAE2; --ink-2: #B8A99C; --brown: #C79B82; --brown-deep: #D8B49E;
  --glass: rgba(28, 22, 18, .82); --glass-line: rgba(241, 234, 226, .18); --hot: #3A2D25; color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.drag { cursor: grabbing; }
#gl { display: block; width: 100%; height: 100%; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--brown); outline-offset: 2px; }

/* top bar */
.top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px var(--gutter-r) 0 var(--gutter); pointer-events: none; }
.brand { pointer-events: auto; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-line); padding: 10px 14px; border-radius: 4px; }
.brand b { display: block; font: 700 clamp(18px, 2.4vw, 26px)/1 var(--f-display); font-stretch: 112%; letter-spacing: -.01em; }
.brand span { display: block; margin-top: 6px; font: 400 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.map { pointer-events: auto; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-line); padding: 8px; border-radius: 4px; }
.map canvas { display: block; width: 190px; height: 160px; }
.map p { margin: 6px 0 0; font: 400 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; }

/* caption card */
.card { position: fixed; left: var(--gutter); bottom: calc(112px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - var(--gutter) - var(--gutter-r))); background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--glass-line); border-radius: 4px; padding: 16px 18px 14px; box-sizing: border-box; transition: opacity .35s; }
.card .eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--brown-deep); }
.card h2 { margin: 8px 0 2px; font: 700 clamp(26px, 3.4vw, 36px)/1 var(--f-display); font-stretch: 108%; letter-spacing: -.015em; text-wrap: balance; }
.card .meta { font: 400 12px/1.4 var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.card ul { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--glass-line); }
.card li { border-bottom: 1px solid var(--glass-line); }
.card li button { all: unset; box-sizing: border-box; display: flex; width: 100%; gap: 10px; align-items: baseline; padding: 7px 2px; cursor: pointer; font: 500 14px/1.3 var(--f-body); }
.card li button:focus-visible { outline: 2px solid var(--brown); }
.card li button small { font: 400 11px/1.3 var(--f-mono); color: var(--ink-2); margin-left: auto; text-align: right; }
.card li button:hover, .card li button.on { color: var(--brown-deep); }
.card li button .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--brown); flex: none; transform: translateY(-1px); }

/* hotspots */
#hs { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.hs { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 8px; pointer-events: auto; background: none; border: 0; padding: 4px; cursor: pointer; opacity: 0; transition: opacity .35s; will-change: transform; }
.hs i { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--brown); box-shadow: 0 0 0 4px rgba(140, 106, 87, .25); flex: none; }
.hs span { background: var(--paper); color: var(--ink); font: 500 12px/1 var(--f-body); padding: 5px 8px; border-radius: 3px; white-space: nowrap; border: 1px solid var(--glass-line); }
.hs.on i { background: var(--brown); }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter); background: linear-gradient(to top, var(--glass) 70%, transparent); display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 6px 12px; font: 500 12px/1 var(--f-body); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--brown); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.bar { display: flex; align-items: center; gap: 10px; }
.btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--paper); border: 0; border-radius: 50%; cursor: pointer; }
.btn.ghost { background: var(--glass); color: var(--ink); border: 1px solid var(--glass-line); width: 34px; height: 34px; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.scrub { position: relative; flex: 1; min-width: 0; height: 34px; display: flex; align-items: center; }
.scrub input { width: 100%; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; height: 34px; cursor: pointer; }
.scrub input::-webkit-slider-runnable-track { height: 4px; background: linear-gradient(to right, var(--brown) var(--p, 0%), var(--glass-line) var(--p, 0%)); border-radius: 2px; }
.scrub input::-moz-range-track { height: 4px; background: var(--glass-line); border-radius: 2px; }
.scrub input::-moz-range-progress { height: 4px; background: var(--brown); border-radius: 2px; }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 2px solid var(--paper); margin-top: -6px; }
.scrub input::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid var(--paper); }
.clock { font: 400 12px/1 var(--f-mono); color: var(--ink-2); min-width: 78px; text-align: right; font-variant-numeric: tabular-nums; }
.tog { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 8px 14px; font: 500 12px/1 var(--f-body); cursor: pointer; white-space: nowrap; }
.tog[aria-pressed="true"] { background: var(--brown); color: #fff; border-color: var(--brown); }
.hint { position: fixed; right: var(--gutter-r); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); font: 400 11px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.6); text-align: right; pointer-events: none; transition: opacity .6s; }

/* loader */
#load { position: fixed; inset: 0; background: var(--paper); display: grid; place-items: center; z-index: 20; transition: opacity .7s; padding: 0 var(--gutter); }
#load.done { opacity: 0; pointer-events: none; }
#load div { width: min(420px, 100%); }
#load b { display: block; font: 800 clamp(34px, 7vw, 56px)/.95 var(--f-display); font-stretch: 115%; letter-spacing: -.02em; }
#load p { margin: 12px 0 18px; font: 400 12px/1.4 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
#load .track { height: 3px; background: var(--glass-line); }
#load .fill { height: 100%; width: 0; background: var(--brown); transition: width .2s; }
#load em { display: block; margin-top: 10px; font: 400 12px var(--f-mono); color: var(--ink-2); font-style: normal; }

@media (max-width: 720px) {
  .map canvas { width: 120px; height: 102px; }
  .brand span { display: none; }
  .card { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); padding: 12px 14px 10px; }
  .card li:nth-child(n+4) { display: none; }
  .card li button small { display: none; }
  .hint { display: none; }
  .clock { min-width: 0; }
  .tog.long { display: none; }
}
@media (max-height: 520px) { .card ul { display: none; } .card { bottom: 96px; } }
@media (prefers-reduced-motion: reduce) { .hs, .card, #load { transition: none; } }
</style>

</head>

/* ---------- three.js scene ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const SKY = new THREE.Color(0xc9d6df);
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 45, 120);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 250);

const sun = new THREE.DirectionalLight(0xfff0dc, 3.1);
const SC = V(5.5, 4.5, 1);
sun.position.copy(SC).add(new THREE.Vector3(-13, 17, 12));
sun.target.position.copy(SC);
sun.castShadow = true;
sun.shadow.mapSize.set(3072, 3072);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 14, bottom: -14, near: 1, far: 70 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target, new THREE.HemisphereLight(0xdfeaf4, 0x8a7a68, 0.3));
const lamps = LIGHTS.map(p => { const l = new THREE.PointLight(0xffe0b4, 5.5, 8, 2); l.position.copy(V(...p)); scene.add(l); return l; });

const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 64), new THREE.MeshStandardMaterial({ color: 0x7d9068, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.position.set(5.5, -0.06, -4.5); ground.receiveShadow = true; scene.add(ground);

const hideable = { ceil: [], roof: [] };
let house = null;
function loadHouse() {
  return new Promise((res, rej) => {
    new GLTFLoader().load('house.glb', g => res(g.scene), e => {
      if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); fill.style.width = p + '%'; pct.textContent = p >= 100 ? 'Preparing the rooms…' : p + '%'; }
      else { pct.textContent = (e.loaded / 1e6).toFixed(1) + ' MB'; }
    }, rej);
  });
}
const fill = document.getElementById('fill'), pct = document.getElementById('pct');

/* ---------- timeline ---------- */
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const easeIO = u => 0.5 - 0.5 * Math.cos(Math.PI * u);
const lerpAng = (a, b, t) => { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * t; };
const toYP = d => ({ yaw: Math.atan2(d.x, d.z), pitch: Math.asin(THREE.MathUtils.clamp(d.y / (d.length() || 1), -1, 1)) });
const fromYP = (yaw, pitch) => new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
let TOTAL = 0;
(function build() {
  let t = 0, prev = null;
  for (const s of STOPS) {
    s.posV = V(...s.pos);
    const start = prev ? prev.posV : V(...s.from);
    const pts = [start, ...(s.route || []).map(p => V(...p)), s.posV];
    s.curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    s.len = s.curve.getLength();
    s.lookV = s.looks.map(l => V(...l));
    s.t0 = t; s.t1 = t + Math.max(s.minMove || 2, s.len / (s.speed || 1.25)); s.t2 = s.t1 + s.dwell; t = s.t2;
    s.startYP = prev ? prev.endYP : toYP(SC.clone().sub(start));
    s.firstYP = toYP(s.lookV[0].clone().sub(s.posV));
    s.endYP = toYP(s.lookV[s.lookV.length - 1].clone().sub(s.posV));
    prev = s;
  }
  TOTAL = t;
})();

function lookAtDwell(s, v) {
  const L = s.lookV, n = L.length;
  const yps = L.map(p => toYP(p.clone().sub(s.posV)));
  if (n === 1) return yps[0];
  const hold = 0.45, trans = 1, units = n * hold + (n - 1) * trans;
  let x = v * units;
  for (let k = 0; k < n; k++) {
    if (x < hold || k === n - 1) return yps[k];
    x -= hold;
    if (x < trans) { const e = easeIO(x / trans); return { yaw: lerpAng(yps[k].yaw, yps[k + 1].yaw, e), pitch: yps[k].pitch + (yps[k + 1].pitch - yps[k].pitch) * e }; }
    x -= trans;
  }
  return yps[n - 1];
}
function stopIndexAt(t) { for (const s of STOPS) if (t < s.t2) return s.n; return STOPS.length - 1; }
function stateAt(t) {
  const s = STOPS[stopIndexAt(t)];
  let pos, yaw, pitch, moving = false;
  if (t < s.t1) {
    moving = true;
    const u0 = (t - s.t0) / (s.t1 - s.t0), u = easeIO(u0);
    pos = s.curve.getPointAt(Math.min(u, 0.9999));
    const tan = s.curve.getTangentAt(Math.min(u, 0.9999));
    let tp;
    if (s.fly) tp = toYP(SC.clone().add(new THREE.Vector3(0, 1, 0)).sub(pos));
    else if (s.fly2) tp = toYP(SC.clone().sub(pos));
    else tp = { yaw: Math.atan2(tan.x, tan.z), pitch: 0 };
    const w1 = smooth(0, 0.3, u0), w2 = smooth(s.fly || s.fly2 ? 0.45 : 0.6, 1, u0);
    yaw = lerpAng(lerpAng(s.startYP.yaw, tp.yaw, w1), s.firstYP.yaw, w2);
    const p1 = s.startYP.pitch + (tp.pitch - s.startYP.pitch) * w1;
    pitch = p1 + (s.firstYP.pitch - p1) * w2;
  } else {
    pos = s.posV.clone();
    const r = lookAtDwell(s, (t - s.t1) / s.dwell);
    yaw = r.yaw; pitch = r.pitch;
    const sway = Math.sin((t - s.t1) * 0.9);
    yaw += sway * 0.006; pitch += Math.sin((t - s.t1) * 0.63) * 0.003;
  }
  return { pos, yaw, pitch, moving, stop: s };
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const elName = $('c-name'), elEye = $('c-eye'), elMeta = $('c-meta'), elItems = $('c-items'), elHs = $('hs');
const chips = $('chips');
STOPS.forEach(s => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = s.chip; b.setAttribute('role', 'tab'); b.addEventListener('click', () => { jumpTo(s.n); }); chips.appendChild(b); s.chipEl = b; });
let hotEls = [], shownStop = -1, focusItem = null;
function renderStop(s) {
  elEye.textContent = `Stop ${s.n + 1} of ${STOPS.length}`;
  elName.textContent = s.name; elMeta.textContent = s.meta || '';
  elItems.innerHTML = ''; elHs.innerHTML = ''; hotEls = [];
  s.items.forEach((it, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span class="pip"></span><span></span><small></small>`;
    b.children[1].textContent = it[0]; b.children[2].textContent = it[1];
    b.addEventListener('click', () => { focusOn(s, i); });
    li.appendChild(b); elItems.appendChild(li);
    const h = document.createElement('button'); h.className = 'hs'; h.innerHTML = '<i></i><span></span>'; h.children[1].textContent = it[0];
    h.addEventListener('click', () => focusOn(s, i));
    elHs.appendChild(h);
    hotEls.push({ h, b, p: V(...it[2]), name: it[0] });
  });
  [...chips.children].forEach((c, i) => { c.classList.toggle('on', i === s.n); c.setAttribute('aria-selected', i === s.n); });
  s.chipEl.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  shownStop = s.n; focusItem = null;
}

let time = 0, playing = true, explore = false, speed = 1;
let yawOff = 0, pitchOff = 0, yawTgt = 0, pitchTgt = 0, dragging = false, lastCam = null;
const seek = $('seek'), clock = $('clock'), playBtn = $('play'), ico = $('ico');
const ICON_PLAY = 'M7 4l13 8-13 8z', ICON_PAUSE = 'M6 4h4v16H6zM14 4h4v16h-4z';
function setPlaying(p) { playing = p; ico.firstElementChild.setAttribute('d', p ? ICON_PAUSE : ICON_PLAY); playBtn.setAttribute('aria-label', p ? 'Pause tour' : 'Play tour'); if (p) { yawTgt = pitchTgt = 0; focusItem = null; hotEls.forEach(x => x.b.classList.remove('on')); } }
function jumpTo(i) { setExplore(false); time = STOPS[i].t1 - (i === 0 ? 2 : 0.6); time = Math.max(0, time); yawOff = pitchOff = yawTgt = pitchTgt = 0; if (!playing) setPlaying(true); }
function focusOn(s, i) {
  if (explore) return;
  setPlaying(false);
  time = Math.max(time, s.t1 + 0.01);
  const st = stateAt(time);
  const d = hotEls[i].p.clone().sub(st.pos); const yp = toYP(d);
  yawTgt = lerpAng(0, yp.yaw - st.yaw, 1); pitchTgt = yp.pitch - st.pitch;
  hotEls.forEach((x, k) => x.b.classList.toggle('on', k === i)); focusItem = i;
}
playBtn.addEventListener('click', () => { if (explore) { setExplore(false); jumpTo(0); return; } if (!playing && time >= TOTAL) time = 0; setPlaying(!playing); });
$('prev').addEventListener('click', () => jumpTo(Math.max(0, (stopIndexAt(time) - (time - STOPS[stopIndexAt(time)].t1 > 2 ? 0 : 1)))));
$('next').addEventListener('click', () => jumpTo(Math.min(STOPS.length - 1, stopIndexAt(time) + 1)));
seek.addEventListener('input', () => { setExplore(false); time = seek.value / 1000 * TOTAL; yawOff = pitchOff = yawTgt = pitchTgt = 0; });
const exploreBtn = $('explore');
exploreBtn.addEventListener('click', () => setExplore(!explore));
const fmtT = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 1.5; controls.maxDistance = 45;
controls.enabled = false;
function setExplore(on) {
  if (on === explore) return;
  explore = on; exploreBtn.setAttribute('aria-pressed', on);
  controls.enabled = on;
  if (on) {
    setPlaying(false);
    if (lastCam) { camera.position.copy(lastCam.pos); }
    controls.target.copy(SC.clone().setY(0.4)); controls.update();
    $('hint').textContent = 'Drag to orbit · scroll to zoom · right-drag to pan'; $('hint').style.opacity = 1;
    elHs.style.opacity = 0.0;
  } else {
    elHs.style.opacity = 1; $('hint').textContent = 'Drag to look around';
  }
}

/* look around in tour mode */
let px = 0, py = 0;
canvas.addEventListener('pointerdown', e => { if (explore) return; dragging = true; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); $('stage').classList.add('drag'); $('hint').style.opacity = 0; });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const k = camera.fov * Math.PI / 180 / canvas.clientHeight;
  yawOff -= (e.clientX - px) * k * 1.0; pitchOff += (e.clientY - py) * k * 1.0;
  yawOff = THREE.MathUtils.clamp(yawOff, -2.4, 2.4); pitchOff = THREE.MathUtils.clamp(pitchOff, -0.9, 0.9);
  yawTgt = yawOff; pitchTgt = pitchOff; px = e.clientX; py = e.clientY;
});
const endDrag = () => { dragging = false; $('stage').classList.remove('drag'); if (playing) { yawTgt = pitchTgt = 0; } };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === 'ArrowLeft') $('prev').click();
});

/* minimap */
const mm = $('mm'), mx = mm.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawMap(pos, yaw) {
  const w = mm.width, h = mm.height, pad = 14;
  const minX = -0.5, maxX = 11.5, minY = -1.9, maxY = 9.4;
  const sc = Math.min((w - pad * 2) / (maxX - minX), (h - pad * 2) / (maxY - minY));
  const ox = (w - (maxX - minX) * sc) / 2, oy = (h - (maxY - minY) * sc) / 2;
  const X = x => ox + (x - minX) * sc, Y = y => oy + (maxY - y) * sc;
  mx.clearRect(0, 0, w, h);
  const ink = css('--ink'), brown = css('--brown');
  mx.lineWidth = 1.5; mx.strokeStyle = ink; mx.fillStyle = css('--hot');
  const rect = (a, fill) => { mx.beginPath(); mx.rect(X(a[0]), Y(a[3]), (a[1] - a[0]) * sc, (a[3] - a[2]) * sc); if (fill) mx.fill(); mx.stroke(); };
  rect(BALCONY, false);
  for (const k in ROOMS) { const r = ROOMS[k]; rect([r[0], r[1], r[2], r[3]], true); }
  const cur = STOPS[stopIndexAt(time)];
  mx.fillStyle = brown;
  const hl = cur.room ? ROOMS[cur.room] : null;
  if (hl) { mx.globalAlpha = 0.35; mx.fillRect(X(hl[0]), Y(hl[3]), (hl[1] - hl[0]) * sc, (hl[3] - hl[2]) * sc); mx.globalAlpha = 1; }
  // stops
  mx.fillStyle = ink;
  STOPS.forEach(s => { if (s.n === 0 || s.n === STOPS.length - 1) return; mx.beginPath(); mx.arc(X(s.pos[0]), Y(s.pos[1]), 2.4, 0, 7); mx.fill(); });
  // camera
  const bx = pos.x, by = -pos.z;
  const cx = THREE.MathUtils.clamp(X(bx), 4, w - 4), cy = THREE.MathUtils.clamp(Y(by), 4, h - 4);
  const hd = Math.atan2(Math.cos(yaw), Math.sin(yaw));   // canvas heading: x right, canvas y = three z
  const fov = 1.1, len = 34;
  mx.fillStyle = brown; mx.globalAlpha = 0.35;
  mx.beginPath(); mx.moveTo(cx, cy); mx.arc(cx, cy, len, hd - fov / 2, hd + fov / 2); mx.closePath(); mx.fill(); mx.globalAlpha = 1;
  mx.fillStyle = brown; mx.strokeStyle = css('--paper'); mx.lineWidth = 2;
  mx.beginPath(); mx.arc(cx, cy, 6, 0, 7); mx.fill(); mx.stroke();
}

/* ---------- main loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const hf = 37 * Math.PI / 180;      // 24 mm lens: 74 degrees across
  camera.fov = THREE.MathUtils.clamp(2 * Math.atan(Math.tan(hf) / camera.aspect) * 180 / Math.PI, 50, 100);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now();
const tmp = new THREE.Vector3();
let roofState = null;
function setRoof(hidden) {
  if (roofState === hidden) return; roofState = hidden;
  hideable.ceil.forEach(o => o.visible = !hidden);
  hideable.roof.forEach(o => o.visible = !hidden);
  sun.shadow.needsUpdate = true;
}
function frame(now, manual) {
  if (!manual) requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (!house) return;
  if (playing && !explore) {
    time += dt * speed;
    if (time >= TOTAL) { time = TOTAL; setPlaying(false); setExplore(true); }
  }
  const finale = STOPS[STOPS.length - 1];
  const st = stateAt(time);
  if (st.stop.n !== shownStop) renderStop(st.stop);
  if (!explore) {
    const k = 1 - Math.exp(-dt * (dragging ? 30 : (playing ? 2.2 : 6)));
    yawOff += (yawTgt - yawOff) * k; pitchOff += (pitchTgt - pitchOff) * k;
    const yaw = st.yaw + yawOff, pitch = THREE.MathUtils.clamp(st.pitch + pitchOff, -1.2, 1.2);
    camera.position.copy(st.pos);
    camera.lookAt(tmp.copy(st.pos).add(fromYP(yaw, pitch)));
    lastCam = { pos: st.pos.clone(), yaw };
    setRoof(time > finale.t0 + (finale.t1 - finale.t0) * 0.28);
  } else {
    controls.update(); setRoof(true);
    const d = camera.getWorldDirection(tmp); lastCam = { pos: camera.position.clone(), yaw: Math.atan2(d.x, d.z) };
  }
  // dock
  const p = time / TOTAL; seek.value = Math.round(p * 1000); seek.style.setProperty('--p', (p * 100) + '%');
  clock.textContent = `${fmtT(time)} / ${fmtT(TOTAL)}`;
  // hotspots appear once the camera has nearly stopped
  const show = !explore && !st.moving && (time - st.stop.t1) > 0.5;
  const w = innerWidth, h = innerHeight;
  hotEls.forEach(x => {
    tmp.copy(x.p).project(camera);
    const inFront = tmp.z < 1 && tmp.z > -1;
    const sx = (tmp.x * 0.5 + 0.5) * w, sy = (-tmp.y * 0.5 + 0.5) * h;
    const vis = show && inFront && sx > 24 && sx < w - 24 && sy > 70 && sy < h - 130;
    x.h.style.transform = `translate(${sx - 11}px, ${sy - 11}px)`;
    x.h.style.opacity = vis ? 1 : 0; x.h.style.pointerEvents = vis ? 'auto' : 'none';
    x.h.classList.toggle('on', focusItem !== null && hotEls[focusItem] === x);
  });
  drawMap(lastCam.pos, lastCam.yaw);
  renderer.render(scene, camera);
}

/* ---------- boot ---------- */
loadHouse().then(root => {
  house = root;
  root.traverse(o => {
    if (o.isMesh) {
      const m = o.material;
      const clear = m && (m.transparent || m.opacity < 1);
      o.castShadow = !clear; o.receiveShadow = true;
      if (m && clear) { m.depthWrite = false; m.side = THREE.DoubleSide; }
      if (m && m.map) m.map.anisotropy = 4;
      if (/^Ceiling_/.test(o.name)) hideable.ceil.push(o);
      if (/^Roof_Slab/.test(o.name)) hideable.roof.push(o);
    }
  });
  scene.add(root);
  renderStop(STOPS[0]);
  setRoof(false);
  document.getElementById('load').classList.add('done');
  setTimeout(() => { $('hint').style.opacity = 0; }, 9000);
  window.__tour = { STOPS, stateAt, get time() { return time; }, set time(v) { time = v; }, setPlaying, TOTAL, camera, jumpTo, setExplore };
}).catch(err => {
  document.querySelector('#load p').textContent = 'Could not load the model. ' + (err && err.message ? err.message : '');
});
requestAnimationFrame(frame);
</script>

</body>
</html>
